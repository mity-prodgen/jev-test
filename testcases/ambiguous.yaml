        type: choice
        instructions: "What is the customer's tone?"
        criteria: {calm: null, frustrated: null, angry: null}
      urgency:
        type: noul
        instructions: "Does this message need to be handled today rather than in the next few business days?"

  - id: urgent_but_calm_2
    state: >
      Our compliance audit is tomorrow morning and we need the export
