batch: ambiguous
description: >
  Support tickets deliberately written to be genuinely hard to classify on
  tone (calm/frustrated/angry) and/or urgency (does this need same-day
  handling?). No single correct answer is claimed for the "ambiguous"-tagged
  cases - expected is left unset for those. A handful of "control" cases with
  a clear, uncontroversial answer are included so the confidence/probability
  spread on ambiguous cases can be compared against a clean-case baseline.

cases:
  # --- controls: unambiguous on both dimensions ---
  - id: control_calm_not_urgent
    state: >
      Hi, whenever you get a chance, could you let me know if there's a way
      to export my reports as CSV instead of PDF? No rush at all, just
      curious for a future project.
    tags: [control]
    questions:
      tone:
        type: choice
        instructions: "What is the customer's tone?"
        criteria: {calm: null, frustrated: null, angry: null}
      urgency:
        type: noul
        instructions: "Does this message need to be handled today rather than in the next few business days?"
    expected:
      tone: calm
      urgency: false

  - id: control_angry_urgent
    state: >
      This is the THIRD time I'm emailing about this. Our checkout has been
      completely broken for six hours and we are losing thousands of
      dollars in sales every hour it stays down. Fix this immediately or
      we're canceling our contract.
    tags: [control]
    questions:
      tone:
        type: choice
        instructions: "What is the customer's tone?"
        criteria: {calm: null, frustrated: null, angry: null}
      urgency:
        type: noul
        instructions: "Does this message need to be handled today rather than in the next few business days?"
    expected:
      tone: angry
      urgency: true

  - id: control_frustrated_moderate
    state: >
      This is the second time this month I've had to reach out about the
      same billing glitch. It's frustrating that it keeps coming back, but
      I know these things take time to fix properly.
    tags: [control]
    questions:
      tone:
        type: choice
        instructions: "What is the customer's tone?"
        criteria: {calm: null, frustrated: null, angry: null}
      urgency:
        type: noul
        instructions: "Does this message need to be handled today rather than in the next few business days?"
    expected:
      tone: frustrated
      urgency: false

  - id: control_calm_urgent
    state: >
      Our production payment webhook has been silent since this morning's
      deploy - could someone confirm today whether this is a known issue on
      your end? Happy to hop on a call if that's faster.
    tags: [control]
    questions:
      tone:
        type: choice
        instructions: "What is the customer's tone?"
        criteria: {calm: null, frustrated: null, angry: null}
      urgency:
        type: noul
        instructions: "Does this message need to be handled today rather than in the next few business days?"
    expected:
      tone: calm
      urgency: true

  # --- ambiguous: annoyed but not urgent ---
  - id: annoyed_not_urgent_1
    state: >
      Honestly kind of annoying that this keeps happening, but it's not
      like it's stopping me from using the product, so just flagging it
      whenever someone has time.
    tags: [ambiguous, tone_ambiguous]
    questions:
      tone:
        type: choice
        instructions: "What is the customer's tone?"
        criteria: {calm: null, frustrated: null, angry: null}
      urgency:
        type: noul
        instructions: "Does this message need to be handled today rather than in the next few business days?"

  - id: annoyed_not_urgent_2
    state: >
      Not a huge deal in the grand scheme of things, but I've noticed the
      dashboard loads noticeably slower than it used to. Would be nice if
      someone looked into it at some point.
    tags: [ambiguous, tone_ambiguous]
    questions:
      tone:
        type: choice
        instructions: "What is the customer's tone?"
        criteria: {calm: null, frustrated: null, angry: null}
      urgency:
        type: noul
        instructions: "Does this message need to be handled today rather than in the next few business days?"

  - id: annoyed_not_urgent_3
    state: >
      I get that bugs happen, but this is the kind of thing that makes me
